<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Availability Checker</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#eef6f4;color:#19363b;font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:clamp(16px,6vh,64px) auto;padding:0 16px} h1{line-height:1.15;color:#123d46}
h2{font-size:19px;margin:0;color:#006a65} section,form{background:white;border:1px solid #bedbd6;border-radius:12px;padding:20px;margin:16px 0}
dl{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:0} dd{text-align:right;font-weight:600;margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px} label{font-weight:600} input[type=number]{display:block;width:100%;padding:9px;margin-top:4px;border:1px solid #839b96;border-radius:6px;font:inherit}
.toggle{display:block;margin:16px 0} button{background:#006d68;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
output{display:block;margin-top:8px} output[data-code]{color:#9f2948} output[data-code=AVAILABLE]{color:#146044}
@media(max-width:480px){.fields{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body><main>
<h1>Room Availability Checker</h1><p>Check whether a time window is free for Room A101. Checking availability leaves the booking schedule unchanged.</p>
<section><h2>Room A101</h2><dl><dt>Reference time</dt><dd id="now"></dd><dt>Room status</dt><dd id="status"></dd><dt>Existing bookings</dt><dd id="bookings"></dd></dl></section>
<form novalidate><div class="fields">
<label>Start (minutes after midnight)<input type="number" name="start" placeholder="660 = 11:00"></label>
<label>Duration (minutes)<input type="number" name="duration" placeholder="1 to 120"></label></div>
<label class="toggle"><input type="checkbox" name="blocked"> Room blocked</label>
<button>Check availability</button></form>
<section><h2>Availability result</h2><output aria-live="polite"></output></section>
</main><script>
// Practice 11 uses half-open intervals: a booking ending at start is adjacent.
const RoomRules = (() => {
  const now = 540;
  const bookings = Object.freeze([Object.freeze([600, 660])]);

  function clock(minutes) {
    return [Math.floor(minutes / 60), minutes % 60]
      .map(part => String(part).padStart(2, "0")).join(":");
  }

  function validate(start, duration) {
    if (!Number.isInteger(start) || start < 0 || start >= 1440)
      return {reasonCode: "INVALID_START", message: "Enter a whole start minute from 0 to 1439."};
    if (!Number.isInteger(duration) || duration < 1 || duration > 120)
      return {reasonCode: "DURATION", message: "Enter a duration of 1 to 120 whole minutes."};
    if (start <= now)
      return {reasonCode: "PAST_TIME", message: "Start time must be after 09:00."};
    if (start + duration > 1440)
      return {reasonCode: "INVALID_INTERVAL", message: "The interval must end by midnight."};
  }

  function check(startInput, durationInput, blocked) {
    const minute = value => String(value ?? "").trim() === "" ? NaN : Number(value);
    const start = minute(startInput);
    const duration = minute(durationInput);
    const error = validate(start, duration);
    if (error) return {available: false, ...error};
    const end = start + duration;
    if (blocked) return {available: false, reasonCode: "BLOCKED", message: "Unavailable — Room A101 is blocked."};
    if (bookings.some(([from, to]) => start < to && end > from))
      return {available: false, reasonCode: "OVERLAP", message: "Unavailable — overlaps an existing booking."};
    return {available: true, reasonCode: "AVAILABLE", message: "Available — Room A101 is free from " + clock(start) + " to " + clock(end) + "."};
  }
  return {now, bookings, clock, check};
})();
if (typeof module !== "undefined") module.exports = RoomRules;
</script><script>
const form = document.querySelector("form");
const result = document.querySelector("output");
const {start, duration, blocked} = form.elements;
document.querySelector("#now").textContent = RoomRules.clock(RoomRules.now);
document.querySelector("#bookings").textContent = RoomRules.bookings
  .map(pair => pair.map(RoomRules.clock).join("–")).join(", ");
function reset() {
  document.querySelector("#status").textContent = blocked.checked ? "Blocked" : "Not blocked";
  result.textContent = "Select Check availability to see the result.";
  delete result.dataset.code;
}
form.addEventListener("input", reset);
form.addEventListener("submit", event => {
  event.preventDefault();
  const decision = RoomRules.check(start.value, duration.value, blocked.checked);
  result.textContent = decision.message;
  result.dataset.code = decision.reasonCode;
});
reset();
</script></body>
</html>
